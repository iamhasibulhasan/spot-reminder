                                      trips.isEmpty() -> "No trips yet"
                                      else -> "${trips.size} trip${if (trips.size == 1) "" else "s"} · ${"%.0f".format(totalCost)} spent"
                                  }
                                  textSize = 12f
                                  setTextColor(if (isActiveHere) color(R.color.accent) else color(R.color.river_soft))
