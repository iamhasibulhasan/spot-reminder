                      try {
                          account = task.getResult(ApiException::class.java)
                          updateAccountUi()
                      } catch (e: ApiException) {
                          Toast.makeText(this, "Sign-in didn't complete (code ${e.statusCode}).", Toast.LENGTH_LONG).show()
                      }
                  }

              private val permLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      updatePermStatus()
                      if (hasLocation() && !hasBackground()) askBackground()
                  }

              private val bgLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { updatePermStatus() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_settings)

                  findViewById<View>(R.id.btnBack).setOnClickListener { finish() }

                  avatar = findViewById(R.id.avatar)
                  profileName = findViewById(R.id.profileName)
                  profileEmail = findViewById(R.id.profileEmail)
                  btnSignIn = findViewById(R.id.btnSignIn)
                  btnSignOut = findViewById(R.id.btnSignOut)
                  backupActions = findViewById(R.id.backupActions)
                  themeGroup = findViewById(R.id.themeGroup)
                  permStatus = findViewById(R.id.permStatus)

                  avatar.clipToOutline = true
                  avatar.outlineProvider = ViewOutlineProvider.BACKGROUND

                  val gso = GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN)
                      .requestScopes(Scope("https://www.googleapis.com/auth/drive.appdata"))
                      .build()
                  googleClient = GoogleSignIn.getClient(this, gso)
                  account = GoogleSignIn.getLastSignedInAccount(this)
                  updateAccountUi()

                  btnSignIn.setOnClickListener { signInLauncher.launch(googleClient.signInIntent) }
                  btnSignOut.setOnClickListener {
                      googleClient.signOut().addOnCompleteListener {
                          account = null
                          updateAccountUi()
                      }
                  }
                  findViewById<View>(R.id.btnBackupNow).setOnClickListener { doBackup() }
                  findViewById<View>(R.id.btnRestore).setOnClickListener { doRestore() }

                  // Local profile (name/phone/address), separate from the Google account
                  val nameInput = findViewById<TextInputEditText>(R.id.profileNameInput)
                  val phoneInput = findViewById<TextInputEditText>(R.id.profilePhoneInput)
                  val addressInput = findViewById<TextInputEditText>(R.id.profileAddressInput)
                  nameInput.setText(Store.profileName(this))
                  phoneInput.setText(Store.profilePhone(this))
                  addressInput.setText(Store.profileAddress(this))
                  findViewById<View>(R.id.btnSaveProfile).setOnClickListener {
                      Store.saveProfile(
                          this,
                          nameInput.text?.toString()?.trim().orEmpty(),
                          phoneInput.text?.toString()?.trim().orEmpty(),
                          addressInput.text?.toString()?.trim().orEmpty()
                      )
                      Toast.makeText(this, "Profile saved.", Toast.LENGTH_SHORT).show()
                  }

                  // Theme
                  when (Store.themeMode(this)) {
                      "light" -> themeGroup.check(R.id.themeLight)
                      "dark" -> themeGroup.check(R.id.themeDark)
                      else -> themeGroup.check(R.id.themeSystem)
                  }
                  themeGroup.setOnCheckedChangeListener { _, checkedId ->
                      val mode = when (checkedId) {
                          R.id.themeLight -> "light"
                          R.id.themeDark -> "dark"
                          else -> "system"
                      }
                      if (mode != Store.themeMode(this)) {
                          Store.setThemeMode(this, mode)
                          App.applyTheme(mode)
                      }
                  }

                  // Permissions
                  findViewById<View>(R.id.btnGrant).setOnClickListener { requestPermissions() }
                  findViewById<View>(R.id.btnAppSettings).setOnClickListener { openAppSettings() }
                  findViewById<View>(R.id.btnBattery).setOnClickListener {
                      try {
                          startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                      } catch (e: Exception) {
                          openAppSettings()
