          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="14dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <ImageButton
                          android:id="@+id/btnBack"
                          android:layout_width="40dp"
                          android:layout_height="40dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:contentDescription="Back"
                          android:src="@drawable/ic_back" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="4dp"
                          android:text="Settings"
                          android:textColor="@color/ink"
                          android:textSize="22sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- Account -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:background="@drawable/bg_paper"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Account"
                          android:textColor="@color/ink"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <ImageView
                              android:id="@+id/avatar"
                              android:layout_width="52dp"
                              android:layout_height="52dp"
                              android:background="@drawable/bg_avatar"
                              android:contentDescription="Profile photo"
                              android:padding="10dp"
                              android:src="@drawable/ic_person" />

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="12dp"
                              android:layout_weight="1"
                              android:orientation="vertical">

                              <TextView
                                  android:id="@+id/profileName"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="Not signed in"
                                  android:textColor="@color/ink"
                                  android:textSize="16sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/profileEmail"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="Sign in to back up your cities and spots"
                                  android:textColor="@color/river_soft"
                                  android:textSize="13sp" />
                          </LinearLayout>
                      </LinearLayout>

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnSignIn"
                          android:layout_width="match_parent"
                          android:layout_height="46dp"
                          android:layout_marginTop="12dp"
                          android:text="Sign in with Google"
                          android:textAllCaps="false"
                          android:textSize="14sp" />

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnSignOut"
                          style="?attr/materialButtonOutlinedStyle"
                          android:layout_width="match_parent"
                          android:layout_height="42dp"
                          android:layout_marginTop="10dp"
                          android:text="Sign out"
                          android:textAllCaps="false"
                          android:textSize="13sp"
                          android:visibility="gone" />

                      <LinearLayout
                          android:id="@+id/backupActions"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:orientation="horizontal"
                          android:visibility="gone">

                          <com.google.android.material.button.MaterialButton
                              android:id="@+id/btnBackupNow"
                              style="?attr/materialButtonOutlinedStyle"
                              android:layout_width="0dp"
                              android:layout_height="42dp"
                              android:layout_weight="1"
                              android:text="Back up now"
                              android:textAllCaps="false"
                              android:textSize="13sp" />

                          <com.google.android.material.button.MaterialButton
                              android:id="@+id/btnRestore"
                              style="?attr/materialButtonOutlinedStyle"
                              android:layout_width="0dp"
                              android:layout_height="42dp"
                              android:layout_marginStart="6dp"
                              android:layout_weight="1"
                              android:text="Restore"
                              android:textAllCaps="false"
                              android:textSize="13sp" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- Your profile (local, separate from the Google account) -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:background="@drawable/bg_paper"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Your profile"
                          android:textColor="@color/ink"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="2dp"
                          android:text="Kept on this phone only."
                          android:textColor="@color/river_soft"
                          android:textSize="12sp" />

                      <com.google.android.material.textfield.TextInputLayout
                          style="@style/Widget.SpotReminder.TextField"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:hint="Full name">

                          <com.google.android.material.textfield.TextInputEditText
                              android:id="@+id/profileNameInput"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:imeOptions="actionNext"
                              android:inputType="textPersonName|textCapWords"
                              android:singleLine="true" />
                      </com.google.android.material.textfield.TextInputLayout>

                      <com.google.android.material.textfield.TextInputLayout
                          style="@style/Widget.SpotReminder.TextField"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:hint="Phone number">

                          <com.google.android.material.textfield.TextInputEditText
                              android:id="@+id/profilePhoneInput"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:imeOptions="actionNext"
                              android:inputType="phone"
                              android:singleLine="true" />
                      </com.google.android.material.textfield.TextInputLayout>

                      <com.google.android.material.textfield.TextInputLayout
                          style="@style/Widget.SpotReminder.TextField"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:hint="Address">

                          <com.google.android.material.textfield.TextInputEditText
                              android:id="@+id/profileAddressInput"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:imeOptions="actionDone"
                              android:inputType="textPostalAddress|textCapSentences"
                              android:maxLines="3" />
                      </com.google.android.material.textfield.TextInputLayout>

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnSaveProfile"
                          android:layout_width="match_parent"
                          android:layout_height="46dp"
                          android:layout_marginTop="10dp"
                          android:text="Save profile"
                          android:textAllCaps="false"
                          android:textSize="14sp" />
                  </LinearLayout>

                  <!-- Appearance -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:background="@drawable/bg_paper"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Appearance"
                          android:textColor="@color/ink"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <RadioGroup
                          android:id="@+id/themeGroup"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:orientation="vertical">

                          <RadioButton
                              android:id="@+id/themeSystem"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:paddingTop="6dp"
                              android:paddingBottom="6dp"
                              android:text="System default"
                              android:textColor="@color/ink"
                              android:textSize="14sp" />

                          <RadioButton
                              android:id="@+id/themeLight"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:paddingTop="6dp"
                              android:paddingBottom="6dp"
                              android:text="Light"
                              android:textColor="@color/ink"
                              android:textSize="14sp" />

                          <RadioButton
                              android:id="@+id/themeDark"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:paddingTop="6dp"
                              android:paddingBottom="6dp"
                              android:text="Dark"
                              android:textColor="@color/ink"
                              android:textSize="14sp" />
                      </RadioGroup>
                  </LinearLayout>

                  <!-- Reminders / permissions -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:background="@drawable/bg_paper"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Reminders"
                          android:textColor="@color/ink"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/permStatus"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:textColor="@color/river_soft"
                          android:textSize="13sp" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:orientation="horizontal">

                          <com.google.android.material.button.MaterialButton
                              android:id="@+id/btnGrant"
                              android:layout_width="0dp"
                              android:layout_height="42dp"
                              android:layout_weight="1"
                              android:text="Turn on reminders"
                              android:textAllCaps="false"
                              android:textSize="13sp" />

                          <com.google.android.material.button.MaterialButton
                              android:id="@+id/btnAppSettings"
                              style="?attr/materialButtonOutlinedStyle"
                              android:layout_width="0dp"
                              android:layout_height="42dp"
                              android:layout_marginStart="6dp"
                              android:layout_weight="1"
                              android:text="App settings"
                              android:textAllCaps="false"
                              android:textSize="13sp" />
                      </LinearLayout>

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:text="Checks run about every 15 minutes. If reminders come late, stop battery saving for this app."
                          android:textColor="@color/river_soft"
                          android:textSize="12sp" />

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnBattery"
                          style="?attr/borderlessButtonStyle"
                          android:layout_width="wrap_content"
                          android:layout_height="36dp"
                          android:layout_marginStart="-12dp"
                          android:text="Battery settings"
                          android:textAllCaps="false"
                          android:textColor="@color/ink"
                          android:textSize="13sp" />
                  </LinearLayout>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center_horizontal"
                      android:layout_marginTop="20dp"
                      android:layout_marginBottom="8dp"
                      android:text="Spot Reminder — version 1.1"
                      android:textColor="@color/river_soft"
                      android:textSize="12sp" />
              </LinearLayout>
          </ScrollView>
