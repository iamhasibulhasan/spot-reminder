                          } else {
                              val p = GeoPoint(hit.lat, hit.lon)
                              placeMarker(p)
                              map.controller.setZoom(12.0)
                              map.controller.animateTo(p)
                              showResult(hit.name, hit.lat, hit.lon)
                          }
                      }
                  }
              }
          }
