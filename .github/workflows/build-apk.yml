          package com.spotreminder.app

          import android.content.Context
          import androidx.work.Worker
          import androidx.work.WorkerParameters

          /** Runs about every 15 minutes in the background and shows a notification on arrival in a saved city. */
          class LocationWorker(ctx: Context, params: WorkerParameters) : Worker(ctx, params) {
              override fun doWork(): Result {
                  if (LocationChecker.hasLocationPermission(applicationContext)) {
                      LocationChecker.run(applicationContext, true)
                  }
                  return Result.success()
              }
          }
          SPOT_EOF_6
          mkdir -p app/src/main/java/com/spotreminder/app
          cat > app/src/main/java/com/spotreminder/app/MainActivity.kt <<'SPOT_EOF_7'
          package com.spotreminder.app

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import com.google.android.material.button.MaterialButton
          import com.google.android.material.textfield.TextInputEditText
          import com.google.android.material.textfield.TextInputLayout
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit

          class MainActivity : AppCompatActivity() {

              private lateinit var statusLabel: TextView
              private lateinit var statusCity: TextView
              private lateinit var statusDetail: TextView
              private lateinit var setupCard: LinearLayout
              private lateinit var setupText: TextView
              private lateinit var remindCard: LinearLayout
              private lateinit var remindTitle: TextView
              private lateinit var remindList: LinearLayout
              private lateinit var cityLayout: TextInputLayout
              private lateinit var spotLayout: TextInputLayout
              private lateinit var cityInput: TextInputEditText
              private lateinit var spotInput: TextInputEditText
              private lateinit var savedList: LinearLayout

              private val io = Executors.newSingleThreadExecutor()
              private var checking = false
              private var lastNames: List<String> = emptyList()
              private var currentKey: String? = null
              private var dismissedKey: String? = null

              private val permLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      updateSetupCard()
                      if (hasLocation() && !hasBackground()) askBackground()
                      onReady()
                  }

              private val bgLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) {
                      updateSetupCard()
                      onReady()
                  }

              private val mapLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                      val name = r.data?.getStringExtra(MapPickerActivity.EXTRA_CITY)
                      if (r.resultCode == RESULT_OK && !name.isNullOrBlank()) {
                          cityInput.setText(name)
                          cityLayout.error = null
                          spotInput.requestFocus()
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  statusLabel = findViewById(R.id.statusLabel)
                  statusCity = findViewById(R.id.statusCity)
                  statusDetail = findViewById(R.id.statusDetail)
                  setupCard = findViewById(R.id.setupCard)
                  setupText = findViewById(R.id.setupText)
                  remindCard = findViewById(R.id.remindCard)
                  remindTitle = findViewById(R.id.remindTitle)
                  remindList = findViewById(R.id.remindList)
                  cityLayout = findViewById(R.id.cityLayout)
                  spotLayout = findViewById(R.id.spotLayout)
                  cityInput = findViewById(R.id.cityInput)
                  spotInput = findViewById(R.id.spotInput)
                  savedList = findViewById(R.id.savedList)

                  findViewById<View>(R.id.btnCheck).setOnClickListener { onReady() }
                  findViewById<View>(R.id.btnSetup).setOnClickListener { requestSetup() }
                  findViewById<View>(R.id.btnSettings).setOnClickListener { openAppSettings() }
                  findViewById<View>(R.id.btnAdd).setOnClickListener { addSpot() }
                  findViewById<View>(R.id.btnMap).setOnClickListener {
                      mapLauncher.launch(Intent(this, MapPickerActivity::class.java))
                  }
                  findViewById<View>(R.id.btnGotIt).setOnClickListener {
                      dismissedKey = currentKey
                      renderReminder()
                  }
                  findViewById<View>(R.id.btnBattery).setOnClickListener {
                      try {
                          startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                      } catch (e: Exception) {
                          openAppSettings()
                      }
                  }

                  Notifier.ensureChannel(this)
                  updateSetupCard()
                  renderSaved()
              }

              override fun onResume() {
                  super.onResume()
                  updateSetupCard()
                  onReady()
              }

              // ---------- Permissions ----------

              private fun granted(p: String) =
                  ContextCompat.checkSelfPermission(this, p) == PackageManager.PERMISSION_GRANTED

              private fun hasLocation() = LocationChecker.hasLocationPermission(this)

              private fun hasBackground() =
                  Build.VERSION.SDK_INT < 29 || granted(Manifest.permission.ACCESS_BACKGROUND_LOCATION)

              private fun hasNotif() =
                  Build.VERSION.SDK_INT < 33 || granted(Manifest.permission.POST_NOTIFICATIONS)

              private fun updateSetupCard() {
                  val missing = mutableListOf<String>()
                  if (!hasLocation()) missing.add("location")
                  else if (!hasBackground()) missing.add("location \"Allow all the time\"")
                  if (!hasNotif()) missing.add("notifications")
                  if (missing.isEmpty()) {
                      setupCard.visibility = View.GONE
                  } else {
                      setupCard.visibility = View.VISIBLE
                      setupText.text = "To remind you even when the app is closed, turn on: " +
                          missing.joinToString(" and ") + "."
                  }
              }

              private fun requestSetup() {
                  val need = mutableListOf<String>()
                  if (!hasLocation()) {
                      need.add(Manifest.permission.ACCESS_FINE_LOCATION)
                      need.add(Manifest.permission.ACCESS_COARSE_LOCATION)
                  }
                  if (!hasNotif()) need.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (need.isNotEmpty()) {
                      permLauncher.launch(need.toTypedArray())
                  } else if (!hasBackground()) {
                      askBackground()
                  }
              }

              private fun askBackground() {
                  if (Build.VERSION.SDK_INT < 29 || hasBackground()) return
                  AlertDialog.Builder(this)
                      .setTitle("Allow location all the time")
                      .setMessage(
                          "To remind you when you arrive in a city, even when the app is closed, " +
                              "set Location to \"Allow all the time\"."
                      )
                      .setPositiveButton("Continue") { _, _ ->
                          if (Build.VERSION.SDK_INT >= 30) openAppSettings()
                          else bgLauncher.launch(Manifest.permission.ACCESS_BACKGROUND_LOCATION)
                      }
                      .setNegativeButton("Not now", null)
                      .show()
              }

              private fun openAppSettings() {
                  val i = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$packageName"))
                  startActivity(i)
              }

              // ---------- Location check ----------

              private fun onReady() {
                  if (!hasLocation()) {
                      setStatus("Location", "Turned off", "Tap \"Turn on reminders\" below.")
                      return
                  }
                  scheduleWorker()
                  runCheck()
              }

              private fun scheduleWorker() {
                  val req = PeriodicWorkRequestBuilder<LocationWorker>(15, TimeUnit.MINUTES).build()
                  WorkManager.getInstance(applicationContext)
                      .enqueueUniquePeriodicWork("city-check", ExistingPeriodicWorkPolicy.KEEP, req)
              }

              private fun runCheck() {
                  if (checking) return
                  checking = true
                  setStatus("Finding your location", "Please wait", "")
                  io.execute {
                      val r = LocationChecker.run(applicationContext, false)
                      runOnUiThread {
                          checking = false
                          applyResult(r)
                      }
                  }
              }

              private fun applyResult(r: CheckResult) {
                  if (r.error != null) {
                      lastNames = emptyList()
                      currentKey = null
                      setStatus("Location", "Not available", r.error)
                  } else {
                      lastNames = r.names
                      currentKey = r.matched?.key
                      val label = if (r.matched != null) "You are in a city with saved spots" else "You are in"
                      setStatus(label, r.names.first(), "Detected: " + r.names.joinToString(", "))
                  }
                  if (currentKey != dismissedKey) dismissedKey = null
                  renderReminder()
                  renderSaved()
              }

              private fun recomputeMatch() {
                  if (lastNames.isEmpty()) return
                  val m = Store.load(this).firstOrNull { c -> lastNames.any { LocationChecker.matches(it, c.key) } }
                  if (m != null) Store.setLastNotified(this, m.key)
                  applyResult(CheckResult(lastNames, m, null))
              }

              private fun setStatus(label: String, city: String, detail: String) {
                  statusLabel.text = label
                  statusCity.text = city
                  statusDetail.text = detail
                  statusDetail.visibility = if (detail.isEmpty()) View.GONE else View.VISIBLE
              }

              // ---------- Add / render ----------

              private fun addSpot() {
                  val city = cityInput.text?.toString()?.trim().orEmpty()
                  val spot = spotInput.text?.toString()?.trim().orEmpty()
                  cityLayout.error = null
                  spotLayout.error = null
                  if (city.isEmpty()) { cityLayout.error = "Enter a city name"; return }
                  if (spot.isEmpty()) { spotLayout.error = "Enter a spot name"; return }
                  val key = Store.norm(city)
                  if (key.isEmpty()) { cityLayout.error = "Use letters or numbers"; return }

                  val list = Store.load(this)
                  val entry = list.firstOrNull { it.key == key }
                      ?: CityEntry(key, Store.titleCase(city), mutableListOf()).also { list.add(it) }
                  if (entry.spots.none { Store.norm(it.name) == Store.norm(spot) }) {
                      entry.spots.add(Spot(Store.titleCase(spot), false))
                  }
                  Store.save(this, list)
                  spotInput.setText("")
                  spotInput.requestFocus()

                  // If you are already in this city, show its reminder right away
                  dismissedKey = null
                  recomputeMatch()
                  renderSaved()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun color(id: Int) = ContextCompat.getColor(this, id)

              private fun textButton(label: String, onClick: () -> Unit): MaterialButton =
                  MaterialButton(this, null, android.R.attr.borderlessButtonStyle).apply {
                      text = label
                      isAllCaps = false
                      setTextColor(color(R.color.brick))
                      setOnClickListener { onClick() }
                  }

              private fun renderReminder() {
                  val key = currentKey
                  val city = Store.load(this).firstOrNull { it.key == key }
                  if (city == null || key == dismissedKey) {
                      remindCard.visibility = View.GONE
                      return
                  }
                  remindCard.visibility = View.VISIBLE
                  remindTitle.text = "Welcome to " + city.name + "! Spots you wanted to visit:"
                  remindList.removeAllViews()
                  for (s in city.spots) {
                      val cb = CheckBox(this).apply {
                          text = s.name
                          isChecked = s.done
                          textSize = 16f
                          setTextColor(color(R.color.river))
                          setPadding(dp(8), dp(10), dp(8), dp(10))
                          setOnCheckedChangeListener { _, checked ->
                              s.done = checked
                              val all = Store.load(this@MainActivity)
                              all.firstOrNull { it.key == city.key }
                                  ?.spots?.firstOrNull { it.name == s.name }?.done = checked
                              Store.save(this@MainActivity, all)
                          }
                      }
                      remindList.addView(cb)
                  }
              }

              private fun renderSaved() {
                  savedList.removeAllViews()
                  val cities = Store.load(this)
                  if (cities.isEmpty()) {
                      savedList.addView(TextView(this).apply {
                          text = "Nothing saved yet. Add a city and a spot above."
                          setTextColor(color(R.color.river_soft))
                          setPadding(dp(4), dp(16), dp(4), dp(16))
                      })
                      return
                  }
                  for (c in cities) {
                      val here = c.key == currentKey
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = ContextCompat.getDrawable(
                              this@MainActivity, if (here) R.drawable.bg_current else R.drawable.bg_paper
                          )
                          setPadding(dp(16), dp(10), dp(8), dp(10))
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { topMargin = dp(12) }
                      }

                      val head = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                      }
                      head.addView(TextView(this).apply {
                          text = c.name + if (here) "  (you are here)" else ""
                          textSize = 18f
                          setTypeface(typeface, Typeface.BOLD)
                          setTextColor(color(R.color.river))
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      })
                      head.addView(textButton("Remove city") {
                          AlertDialog.Builder(this)
                              .setTitle("Remove " + c.name + "?")
                              .setMessage("This deletes the city and all its spots.")
                              .setPositiveButton("Remove") { _, _ ->
                                  val all = Store.load(this)
                                  all.removeAll { it.key == c.key }
                                  Store.save(this, all)
                                  recomputeMatch()
                                  renderReminder()
                                  renderSaved()
                              }
                              .setNegativeButton("Cancel", null)
                              .show()
                      })
                      card.addView(head)

                      for (s in c.spots) {
                          val row = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = Gravity.CENTER_VERTICAL
                          }
                          row.addView(TextView(this).apply {
                              text = s.name
                              textSize = 16f
                              setTextColor(color(R.color.river))
                              layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          })
                          row.addView(textButton("Delete") {
                              val all = Store.load(this)
                              val entry = all.firstOrNull { it.key == c.key }
                              entry?.spots?.removeAll { it.name == s.name }
                              if (entry != null && entry.spots.isEmpty()) all.remove(entry)
                              Store.save(this, all)
                              recomputeMatch()
                              renderReminder()
                              renderSaved()
                          })
                          card.addView(row)
                      }
                      savedList.addView(card)
                  }
              }
          }
