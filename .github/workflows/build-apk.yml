          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'SPOT_EOF_54'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              xmlns:tools="http://schemas.android.com/tools"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">

          <ScrollView
              android:layout_width="match_parent"
              android:layout_height="0dp"
              android:layout_weight="1"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="14dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <ImageView
                          android:id="@+id/homeAvatar"
                          android:layout_width="42dp"
                          android:layout_height="42dp"
                          android:background="@drawable/bg_avatar"
                          android:contentDescription="Your profile"
                          android:padding="9dp"
                          android:src="@drawable/ic_person" />

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="10dp"
                          android:layout_weight="1"
                          android:orientation="vertical">

                          <TextView
                              android:id="@+id/greetingName"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Hi, Traveler"
                              android:textColor="@color/ink"
                              android:textSize="18sp"
                              android:textStyle="bold" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Where are you headed?"
                              android:textColor="@color/river_soft"
                              android:textSize="13sp" />
                      </LinearLayout>

                      <ImageButton
                          android:id="@+id/btnBell"
                          android:layout_width="40dp"
                          android:layout_height="40dp"
                          android:background="@drawable/bg_category_circle"
                          android:contentDescription="Notifications"
                          android:padding="9dp"
                          android:src="@drawable/ic_bell" />

                      <ImageButton
                          android:id="@+id/btnSettings"
                          android:layout_width="40dp"
                          android:layout_height="40dp"
                          android:layout_marginStart="8dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:contentDescription="Settings"
                          android:padding="8dp"
                          android:src="@drawable/ic_settings" />
                  </LinearLayout>

                  <!-- Search bar (jumps to the Spots tab) -->
                  <LinearLayout
                      android:id="@+id/homeSearchBar"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginTop="14dp"
                      android:background="@drawable/bg_search_pill"
                      android:gravity="center_vertical"
                      android:orientation="horizontal"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp">

                      <ImageView
                          android:layout_width="18dp"
                          android:layout_height="18dp"
                          android:contentDescription="Search"
                          android:src="@drawable/ic_search" />

                      <TextView
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="10dp"
                          android:layout_weight="1"
                          android:text="Search your saved spots"
                          android:textColor="@color/river_soft"
                          android:textSize="14sp" />
                  </LinearLayout>

                  <!-- Quick actions -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:orientation="horizontal">

                      <LinearLayout
                          android:id="@+id/quickAdd"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:gravity="center_horizontal"
                          android:orientation="vertical">

                          <ImageView
                              android:layout_width="48dp"
                              android:layout_height="48dp"
                              android:background="@drawable/bg_category_circle"
                              android:padding="13dp"
                              android:src="@drawable/ic_add"
                              app:tint="@color/accent" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="4dp"
                              android:text="Add spot"
                              android:textColor="@color/ink"
                              android:textSize="11sp" />
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/quickTrip"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:gravity="center_horizontal"
                          android:orientation="vertical">

                          <ImageView
                              android:layout_width="48dp"
                              android:layout_height="48dp"
                              android:background="@drawable/bg_category_circle"
                              android:padding="13dp"
                              android:src="@drawable/ic_stat_pin"
                              app:tint="@color/accent" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="4dp"
                              android:text="Start trip"
                              android:textColor="@color/ink"
                              android:textSize="11sp" />
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/quickSpots"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:gravity="center_horizontal"
                          android:orientation="vertical">

                          <ImageView
                              android:layout_width="48dp"
                              android:layout_height="48dp"
                              android:background="@drawable/bg_category_circle"
                              android:padding="13dp"
                              android:src="@drawable/ic_nav_list"
                              app:tint="@color/accent" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="4dp"
                              android:text="My spots"
                              android:textColor="@color/ink"
                              android:textSize="11sp" />
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/quickStats"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:gravity="center_horizontal"
                          android:orientation="vertical">

                          <ImageView
                              android:layout_width="48dp"
                              android:layout_height="48dp"
                              android:background="@drawable/bg_category_circle"
                              android:padding="13dp"
                              android:src="@drawable/ic_nav_stats"
                              app:tint="@color/accent" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="4dp"
                              android:text="Stats"
                              android:textColor="@color/ink"
                              android:textSize="11sp" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- Upcoming spots (not yet visited) -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:text="Upcoming spots"
                      android:textColor="@color/ink"
                      android:textSize="16sp"
                      android:textStyle="bold" />

                  <HorizontalScrollView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:clipToPadding="false"
                      android:scrollbars="none">

                      <LinearLayout
                          android:id="@+id/upcomingList"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal" />
                  </HorizontalScrollView>

                  <!-- Permission nudge, only shown when something needs attention -->
                  <LinearLayout
                      android:id="@+id/nudge"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:background="@drawable/bg_current"
                      android:gravity="center_vertical"
                      android:orientation="horizontal"
                      android:padding="10dp"
                      android:visibility="gone">

                      <TextView
                          android:id="@+id/nudgeText"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:textColor="@color/ink"
                          android:textSize="13sp" />

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnNudgeFix"
                          style="?attr/borderlessButtonStyle"
                          android:layout_width="wrap_content"
                          android:layout_height="36dp"
                          android:text="Fix"
                          android:textAllCaps="false"
                          android:textSize="13sp" />
                  </LinearLayout>

                  <!-- Where you are -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:background="@drawable/bg_river"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:id="@+id/statusLabel"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Finding your location"
                          android:textColor="@color/river_light"
                          android:textSize="12sp" />

                      <TextView
                          android:id="@+id/statusCity"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Please wait"
                          android:textColor="@android:color/white"
                          android:textSize="21sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/statusDetail"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="1dp"
                          android:textColor="@color/river_light"
                          android:textSize="12sp" />

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnCheck"
                          style="?attr/borderlessButtonStyle"
                          android:layout_width="wrap_content"
                          android:layout_height="36dp"
                          android:layout_marginStart="-12dp"
                          android:layout_marginTop="2dp"
                          android:text="Check now"
                          android:textAllCaps="false"
                          android:textColor="@color/accent" />
                  </LinearLayout>

                  <!-- Arrival reminder -->
                  <LinearLayout
                      android:id="@+id/remindCard"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:background="@drawable/bg_saffron"
                      android:orientation="vertical"
                      android:padding="14dp"
                      android:visibility="gone">

                      <TextView
                          android:id="@+id/remindTitle"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textColor="@android:color/white"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <LinearLayout
                          android:id="@+id/remindList"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:orientation="vertical" />

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnGotIt"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:layout_marginTop="4dp"
                          android:backgroundTint="@android:color/white"
                          android:text="Got it"
                          android:textAllCaps="false"
                          android:textColor="@color/accent"
                          android:textSize="13sp" />
                  </LinearLayout>

                  <!-- Add spot -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:background="@drawable/bg_paper"
                      android:orientation="vertical"
                      android:padding="12dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Add a spot"
                          android:textColor="@color/ink"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <LinearLayout
                          android:id="@+id/cityLayout"
                          android:layout_width="match_parent"
                          android:layout_height="56dp"
                          android:layout_marginTop="10dp"
                          android:background="@drawable/bg_field_row"
                          android:gravity="center_vertical"
                          android:orientation="horizontal"
                          android:paddingStart="14dp"
                          android:paddingEnd="14dp">

                          <android.widget.AutoCompleteTextView
                              android:id="@+id/cityInput"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:background="@null"
                              android:completionThreshold="2"
                              android:dropDownWidth="match_parent"
                              android:imeOptions="actionNext"
                              android:inputType="textCapWords"
                              android:singleLine="true"
                              android:textColor="@color/ink"
                              android:textColorHint="@color/river_soft"
                              android:textSize="16sp" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="8dp"
                              android:text="City"
                              android:textColor="@color/river_soft"
                              android:textSize="12sp" />
                      </LinearLayout>

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnMap"
                          style="?attr/materialButtonOutlinedStyle"
                          android:layout_width="match_parent"
                          android:layout_height="40dp"
                          android:layout_marginTop="8dp"
                          android:text="Pick city on map"
                          android:textAllCaps="false"
                          android:textSize="13sp" />

                      <LinearLayout
                          android:id="@+id/spotLayout"
                          android:layout_width="match_parent"
                          android:layout_height="56dp"
                          android:layout_marginTop="8dp"
                          android:background="@drawable/bg_field_row"
                          android:gravity="center_vertical"
                          android:orientation="horizontal"
                          android:paddingStart="14dp"
                          android:paddingEnd="14dp">

                          <android.widget.AutoCompleteTextView
                              android:id="@+id/spotInput"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:background="@null"
                              android:completionThreshold="2"
                              android:dropDownWidth="match_parent"
                              android:imeOptions="actionDone"
                              android:inputType="textCapWords"
                              android:singleLine="true"
                              android:textColor="@color/ink"
                              android:textColorHint="@color/river_soft"
                              android:textSize="16sp" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="8dp"
                              android:text="Spot"
                              android:textColor="@color/river_soft"
                              android:textSize="12sp" />
                      </LinearLayout>

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnAdd"
                          android:layout_width="match_parent"
                          android:layout_height="46dp"
                          android:layout_marginTop="8dp"
                          android:text="Save spot"
                          android:textAllCaps="false"
                          android:textSize="15sp" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:text="Type a few letters for suggestions."
                          android:textColor="@color/river_soft"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:layout_marginBottom="8dp"
                      android:text="See all your saved spots and start a trip from the Spots tab below."
                      android:textColor="@color/river_soft"
                      android:textSize="12sp" />
              </LinearLayout>
          </ScrollView>

              <include layout="@layout/bottom_nav" />
          </LinearLayout>
          SPOT_EOF_54
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_map.xml <<'SPOT_EOF_55'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <org.osmdroid.views.MapView
                  android:id="@+id/map"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <!-- Search -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top"
                  android:layout_margin="10dp"
                  android:background="@drawable/bg_paper"
                  android:orientation="vertical"
                  android:padding="8dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="48dp"
                          android:layout_weight="1"
                          android:background="@drawable/bg_field_row"
                          android:gravity="center_vertical"
                          android:orientation="horizontal"
                          android:paddingStart="12dp"
                          android:paddingEnd="12dp">

                          <android.widget.AutoCompleteTextView
                              android:id="@+id/searchInput"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:background="@null"
                              android:completionThreshold="2"
                              android:dropDownWidth="match_parent"
                              android:hint="Search a city"
