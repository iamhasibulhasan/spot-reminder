              // ---------- Account ----------

              private fun updateAccountUi() {
                  val a = account
                  if (a == null) {
                      profileName.text = "Not signed in"
                      profileEmail.text = "Sign in to back up your cities and spots"
                      btnSignIn.visibility = View.VISIBLE
                      btnSignOut.visibility = View.GONE
                      backupActions.visibility = View.GONE
                      avatar.setImageResource(R.drawable.ic_person)
                      avatar.setPadding(dp(10), dp(10), dp(10), dp(10))
                  } else {
                      profileName.text = a.displayName ?: "Signed in"
                      profileEmail.text = a.email ?: ""
                      btnSignIn.visibility = View.GONE
                      btnSignOut.visibility = View.VISIBLE
                      backupActions.visibility = View.VISIBLE
                      loadAvatar(a.photoUrl)
                  }
              }

              private fun loadAvatar(uri: Uri?) {
                  avatar.setImageResource(R.drawable.ic_person)
                  avatar.setPadding(dp(10), dp(10), dp(10), dp(10))
                  if (uri == null) return
                  io.execute {
                      val bmp: Bitmap? = try {
                          URL(uri.toString()).openStream().use { BitmapFactory.decodeStream(it) }
                      } catch (e: Exception) {
                          null
                      }
                      if (bmp != null) {
                          runOnUiThread {
                              avatar.setPadding(0, 0, 0, 0)
                              avatar.setImageBitmap(bmp)
                          }
                      }
                  }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun doBackup() {
                  val email = account?.email
                  if (email == null) { Toast.makeText(this, "Sign in first.", Toast.LENGTH_SHORT).show(); return }
                  val json = Store.rawData(this)
                  Toast.makeText(this, "Backing up...", Toast.LENGTH_SHORT).show()
                  io.execute {
                      try {
                          DriveBackup.backup(this, email, json)
                          runOnUiThread { Toast.makeText(this, "Backed up to Google Drive.", Toast.LENGTH_SHORT).show() }
                      } catch (e: DriveBackup.NeedsConsent) {
                          runOnUiThread { Toast.makeText(this, "Please sign in again to allow Drive access.", Toast.LENGTH_LONG).show() }
                      } catch (e: Exception) {
                          runOnUiThread { Toast.makeText(this, "Backup failed. Check your internet and try again.", Toast.LENGTH_LONG).show() }
                      }
                  }
              }

              private fun doRestore() {
                  val email = account?.email
                  if (email == null) { Toast.makeText(this, "Sign in first.", Toast.LENGTH_SHORT).show(); return }
                  Toast.makeText(this, "Checking for a backup...", Toast.LENGTH_SHORT).show()
                  io.execute {
                      try {
                          val json = DriveBackup.restore(this, email)
                          runOnUiThread {
                              if (json == null) {
                                  Toast.makeText(this, "No backup found yet.", Toast.LENGTH_LONG).show()
                              } else {
                                  AlertDialog.Builder(this)
                                      .setTitle("Restore backup?")
                                      .setMessage("This replaces the cities and spots saved on this phone with your Google Drive backup.")
                                      .setPositiveButton("Restore") { _, _ ->
                                          if (Store.setRawData(this, json)) {
                                              Toast.makeText(this, "Restored. Go back to see your spots.", Toast.LENGTH_LONG).show()
                                          } else {
                                              Toast.makeText(this, "That backup looked corrupted.", Toast.LENGTH_LONG).show()
                                          }
                                      }
                                      .setNegativeButton("Cancel", null)
                                      .show()
                              }
                          }
                      } catch (e: DriveBackup.NeedsConsent) {
                          runOnUiThread { Toast.makeText(this, "Please sign in again to allow Drive access.", Toast.LENGTH_LONG).show() }
                      } catch (e: Exception) {
                          runOnUiThread { Toast.makeText(this, "Restore failed. Check your internet and try again.", Toast.LENGTH_LONG).show() }
                      }
                  }
              }

              // ---------- Permissions ----------

              private fun granted(p: String) =
                  ContextCompat.checkSelfPermission(this, p) == PackageManager.PERMISSION_GRANTED

              private fun hasLocation() = LocationChecker.hasLocationPermission(this)

              private fun hasBackground() =
                  Build.VERSION.SDK_INT < 29 || granted(Manifest.permission.ACCESS_BACKGROUND_LOCATION)

              private fun hasNotif() =
                  Build.VERSION.SDK_INT < 33 || granted(Manifest.permission.POST_NOTIFICATIONS)

              private fun updatePermStatus() {
                  val missing = mutableListOf<String>()
                  if (!hasLocation()) missing.add("location")
                  else if (!hasBackground()) missing.add("location \"Allow all the time\"")
                  if (!hasNotif()) missing.add("notifications")
                  permStatus.text = if (missing.isEmpty())
                      "All set. Reminders can run in the background."
                  else
                      "Missing: " + missing.joinToString(" and ") + "."
              }

              private fun requestPermissions() {
                  val need = mutableListOf<String>()
                  if (!hasLocation()) {
                      need.add(Manifest.permission.ACCESS_FINE_LOCATION)
                      need.add(Manifest.permission.ACCESS_COARSE_LOCATION)
                  }
                  if (!hasNotif()) need.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (need.isNotEmpty()) {
                      permLauncher.launch(need.toTypedArray())
                  } else if (!hasBackground()) {
                      askBackground()
                  }
              }

              private fun askBackground() {
                  if (Build.VERSION.SDK_INT < 29 || hasBackground()) return
                  AlertDialog.Builder(this)
                      .setTitle("Allow location all the time")
                      .setMessage(
                          "To remind you when you arrive in a city, even when the app is closed, " +
                              "set Location to \"Allow all the time\"."
                      )
                      .setPositiveButton("Continue") { _, _ ->
                          if (Build.VERSION.SDK_INT >= 30) openAppSettings()
                          else bgLauncher.launch(Manifest.permission.ACCESS_BACKGROUND_LOCATION)
                      }
                      .setNegativeButton("Not now", null)
                      .show()
              }

              private fun openAppSettings() {
                  startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$packageName")))
              }
          }
